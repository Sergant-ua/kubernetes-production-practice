  name: student01
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: student-full-access
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: student03
  name: student-full-access
rules:
- apiGroups: ["*", "apps", "batch"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
