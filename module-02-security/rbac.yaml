---
# 1. Mentor permissions (full access to student namespaces)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: student01
  name: mentor-full-access
rules:
- apiGroups: ["*", "apps", "batch"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: student01
  name: mentor-student01-binding
subjects:
- kind: User
  name: mentor
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: mentor-full-access
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: student02
  name: mentor-student02-binding
subjects:
- kind: User
  name: mentor
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: mentor-full-access
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: student03
  name: mentor-student03-binding
subjects:
- kind: User
  name: mentor
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: mentor-full-access
  apiGroup: rbac.authorization.k8s.io

---
# 2. Permissions for Student 01 & 03 (full access within their namespace)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: student01
  name: student-full-access
rules:
- apiGroups: ["*", "apps", "batch"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
