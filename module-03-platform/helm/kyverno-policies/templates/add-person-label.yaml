{{- if .Values.mutation.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-person-label
  annotations:
    policies.kyverno.io/title: Assign Person Label to Pods
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Set person=student in student namespaces, person=mentor in the mentor
      namespace, and remove person from Pods in other namespaces.
spec:
  background: {{ .Values.mutation.background }}
  rules:
    - name: label-student-pods
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
{{- range .Values.mutation.studentNamespaces }}
                - {{ . | quote }}
{{- end }}
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              {{ .Values.mutation.labelKey }}: {{ .Values.mutation.studentLabelValue | quote }}

    - name: label-mentor-pods
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - {{ .Values.mutation.mentorNamespace | quote }}
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              {{ .Values.mutation.labelKey }}: {{ .Values.mutation.mentorLabelValue | quote }}

    - name: remove-person-label-elsewhere
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - {{ .Values.mutation.mentorNamespace | quote }}
{{- range .Values.mutation.studentNamespaces }}
                - {{ . | quote }}
{{- end }}
      preconditions:
        all:
          - key: {{ printf "{{ request.object.metadata.labels.%s || '' }}" .Values.mutation.labelKey | quote }}
            operator: NotEquals
            value: ""
      mutate:
        patchesJson6902: |-
          - op: remove
            path: /metadata/labels/{{ .Values.mutation.labelKey }}
{{- end }}
