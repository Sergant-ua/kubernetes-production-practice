apiVersion: v1
kind: ServiceAccount
metadata:
  name: policyreport-exporter
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: policyreport-exporter
rules:
  - apiGroups:
      - wgpolicyk8s.io
    resources:
      - policyreports
    verbs:
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: policyreport-exporter
subjects:
  - kind: ServiceAccount
    name: policyreport-exporter
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: policyreport-exporter
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policyreport-exporter
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: policyreport-exporter
  template:
    metadata:
      labels:
        app: policyreport-exporter
    spec:
      serviceAccountName: policyreport-exporter
      containers:
        - name: exporter
          image: python:3.12-alpine
          command:
            - python
            - -u
            - /app/exporter.py
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: policyreport-exporter
